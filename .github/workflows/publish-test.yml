name: Build Nightly Artifacts

on:
  workflow_dispatch:

  push:
    branches:
      - main

    paths-ignore:
      - '**.md'
      - 'examples/**'
      - 'tests/**'
      - 'docs/**'

permissions:
  contents: read

jobs:
  wheel:
    name: Build Wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04']
        python-version: ['3.10', '3.11', '3.12']
        cuda-version: ['12.8']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          rm -rf /usr/local/cuda-* /opt/cuda
          rm -rf /usr/local/cuda
          bash -x .github/workflows/scripts/free-disk-space.sh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA ${{ matrix.cuda-version }}
        run: |
          bash -x .github/workflows/scripts/cuda-install.sh ${{ matrix.cuda-version }} ${{ matrix.os }}

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git uuid-dev

      - name: Install Python build dependencies (torch matched to CUDA)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "setuptools>=78.1.1,<82" "setuptools-scm>=8" wheel ninja py-cpuinfo build
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cu128
          # Override this repository variable when the coordinated moe-store
          # release advances. GitHub remains the authoritative package source.
          MOE_STORE_TAG="${{ vars.MOE_STORE_RELEASE_TAG || 'v0.2.1' }}"
          python3 -m pip install --no-deps \
            "moe-store @ git+https://github.com/EfficientMoE/moe-store.git@${MOE_STORE_TAG}"

      - name: Fetch CUTLASS headers
        run: |
          git clone --depth 1 --branch v3.9.2 https://github.com/NVIDIA/cutlass.git "${HOME}/cutlass"

      # setuptools-scm derives the version from git history: a commit that is N
      # commits after tag "vX.Y.Z" builds as "X.Y.(Z+1).devN". local_scheme in
      # pyproject.toml strips the "+gHASH" suffix so the sdist is PyPI-valid.
      - name: Build Wheel
        shell: bash
        env:
          NVTX_DISABLE: "1"
        run: |
          export CUDA_HOME="/usr/local/cuda-${{ matrix.cuda-version }}"
          export PATH="${CUDA_HOME}/bin:${PATH}"
          export CUTLASS_DIR="${HOME}/cutlass"
          python3 -m build --wheel --no-isolation
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          asset_name=${wheel_name//"linux"/"manylinux1"}
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          echo "asset_name=${asset_name}" >> $GITHUB_ENV

      - name: Build Source
        if: ${{ matrix.python-version == '3.10' }}
        # --no-isolation: an isolated build env would pip-install bare torch
        # (CUDA-enabled default wheel), making setup.py take the cuda_available
        # path and fail on the missing moe_store import. The runner env already
        # has everything setup.py needs.
        run: |
          python3 -m build --sdist --no-isolation

      - name: Rename Wheel
        run: |
          mv dist/${{ env.wheel_name }} dist/${{ env.asset_name }}

      - name: Upload nightly wheel
        uses: actions/upload-artifact@v4
        with:
          name: moe-infinity-${{ github.sha }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload nightly sdist
        if: ${{ matrix.python-version == '3.10' }}
        uses: actions/upload-artifact@v4
        with:
          name: moe-infinity-${{ github.sha }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
