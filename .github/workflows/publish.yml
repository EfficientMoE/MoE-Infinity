name: Create Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing MoE-Infinity tag to build or repair
        required: true
        type: string
      moe_store_tag:
        description: moe-store tag to vendor (defaults to repository variable or release tag)
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  MOE_STORE_TAG: ${{ inputs.moe_store_tag || vars.MOE_STORE_RELEASE_TAG || inputs.tag || github.ref_name }}

jobs:
  wheel:
    name: Build Wheel
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        cuda-version: ['12.8']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Free Disk Space
        run: |
          rm -rf /usr/local/cuda-* /opt/cuda
          rm -rf /usr/local/cuda
          bash -x .github/workflows/scripts/free-disk-space.sh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA ${{ matrix.cuda-version }}
        run: |
          bash -x .github/workflows/scripts/cuda-install.sh ${{ matrix.cuda-version }} ubuntu-22.04

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git uuid-dev

      - name: Install Python build dependencies (torch matched to CUDA)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "setuptools>=78.1.1,<82" "setuptools-scm>=8" wheel ninja py-cpuinfo build
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cu128
          # GitHub Releases are authoritative for both projects. Coordinated
          # tags are the default; workflow input or repository variable allows
          # an explicitly reviewed moe-store tag when release numbers diverge.
          python3 -m pip install --no-deps \
            "moe-store @ git+https://github.com/EfficientMoE/moe-store.git@${MOE_STORE_TAG}"

      - name: Fetch CUTLASS headers
        run: |
          git clone --depth 1 --branch v3.9.2 https://github.com/NVIDIA/cutlass.git "${HOME}/cutlass"

      - name: Build Wheel
        shell: bash
        env:
          NVTX_DISABLE: "1"
        run: |
          export CUDA_HOME="/usr/local/cuda-${{ matrix.cuda-version }}"
          export PATH="${CUDA_HOME}/bin:${PATH}"
          export CUTLASS_DIR="${HOME}/cutlass"
          python3 -m build --wheel --no-isolation
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          asset_name=${wheel_name//"linux"/"manylinux1"}
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          echo "asset_name=${asset_name}" >> $GITHUB_ENV

      - name: Build Source
        if: ${{ matrix.python-version == '3.10' }}
        # --no-isolation: an isolated build env would pip-install bare torch
        # (CUDA-enabled default wheel), making setup.py take the cuda_available
        # path and fail on the missing moe_store import. The runner env already
        # has everything setup.py needs.
        run: |
          python3 -m build --sdist --no-isolation

      - name: Rename Wheel
        run: |
          mv dist/${{ env.wheel_name }} dist/${{ env.asset_name }}

      - name: Stage release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moe-infinity-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: wheel
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi

  pypi:
    name: Mirror optional sdist to PyPI
    runs-on: ubuntu-22.04
    needs: release
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified source distribution
        uses: actions/download-artifact@v4
        with:
          name: moe-infinity-py3.10
          path: pypi-dist

      - name: Keep only the source distribution
        run: rm -f pypi-dist/*.whl

      - name: Publish optional sdist to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.8
        with:
          skip-existing: true
          packages-dir: pypi-dist
