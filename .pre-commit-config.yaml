# Install both commit-time and push-time hooks with a single `pre-commit install`.
# Running formatters at the pre-push stage as well catches any format drift
# that slips past a commit (e.g. `git commit --no-verify`) before it reaches CI.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

# Vendored third-party kernels (Marlin, Apache-2.0, IST-DASLab; CUTLASS dual
# GEMM mainloop, BSD-3-Clause, NVIDIA) are excluded from style/spelling hooks
# so we keep them byte-for-byte upstream. The cache-simulator research tree is
# sealed the same way: runners and json dumps are pinned by ARTIFACT.sha256 /
# SHA256SUMS, and clang-format treats .json as a language it rewrites.
exclude: ^(moe_infinity/kernel/marlin/|extensions/kernel/dual_gemm/|benchmarks/cache_simulator/research/)

repos:
-   repo: meta
    hooks:
    -   id: check-hooks-apply
    -   id: check-useless-excludes

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
    -   id: check-case-conflict
    # -   id: check-json
    # -   id: check-symlinks
    -   id: check-yaml
    -   id: destroyed-symlinks
    -   id: end-of-file-fixer
    -   id: fix-byte-order-marker
    -   id: fix-encoding-pragma
        args: [--remove]
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: requirements-txt-fixer
    -   id: trailing-whitespace

-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.6.9
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
        # args: [--check]


-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.4
    hooks:
    - id: clang-format

-   repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
    -   id: codespell
        args: [
            # Do not check files that are automatically generated
            '--skip=docs/Gemfile.lock,tests/unit/gpt2-merges.txt,tests/unit/gpt2-vocab.json',
            '--ignore-regex=\\n',  # Do not count the 'n' in an escaped newline as part of a word
            '--ignore-words-list=youn,unsupport,noe,ccompiler,statics,nd,sring',  # Word used in error messages that need rewording; 'sring' is a research policy-arm identifier (exp696), not 'string'
            --check-filenames,
            --check-hidden
        ]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
    -   id: mypy
        args: [--config-file=pyproject.toml]
        files: ^moe_infinity/utils/config\.py$
